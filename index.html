<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UP NEXT MABAR</title>
<style>
:root{
  --gold:#e9c36a;
  --gold-soft:#f7dfa0;
  --gold-dark:#8e6825;
  --ink:#090a0d;
  --panel:rgba(12,13,17,.94);
  --muted:#b8b1a2;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:12px;
}
.frame{
  width:100%;
  max-width:560px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(233,195,106,.9);
  border-radius:17px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.045),transparent 32%),
    linear-gradient(180deg,rgba(19,20,24,.97),rgba(5,6,9,.97));
  box-shadow:0 12px 35px rgba(0,0,0,.45),inset 0 0 22px rgba(233,195,106,.07);
}
.frame:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:17px;
  background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.04) 42%,transparent 52%);
}
.glint{
  position:absolute;top:-50%;left:-35%;width:24%;height:200%;
  transform:rotate(22deg);
  background:linear-gradient(90deg,transparent,rgba(255,235,180,.34),transparent);
  filter:blur(2px);animation:glint 5.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glint{0%,25%{left:-40%;opacity:0}38%{opacity:.8}65%{left:125%;opacity:0}100%{left:125%;opacity:0}}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px 12px;
  border-bottom:1px solid rgba(233,195,106,.25);
  position:relative;z-index:1;
}
.brand{display:flex;align-items:center;gap:11px}
.emblem{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  color:#17120a;font-weight:900;font-size:17px;
  background:linear-gradient(145deg,#fff0bd,#d7a842 65%,#8f641d);
  box-shadow:0 0 14px rgba(233,195,106,.25);
}
.heading{font-size:19px;line-height:1.05;font-weight:900;letter-spacing:1.6px;color:var(--gold-soft)}
.subheading{font-size:9px;letter-spacing:2.3px;color:#c5b58e;margin-top:5px}
.count{
  min-width:48px;text-align:center;padding:6px 10px;border-radius:20px;
  border:1px solid rgba(233,195,106,.55);color:var(--gold-soft);
  font-size:13px;font-weight:800;background:rgba(233,195,106,.08);
}
.list{padding:9px 12px 12px;position:relative;z-index:1}
.row{
  display:flex;align-items:center;gap:12px;min-height:38px;
  padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.065);
  animation:arrive .25s ease-out both;
}
@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.row:last-child{border-bottom:0}
.number{
  flex:0 0 25px;height:25px;border-radius:7px;display:grid;place-items:center;
  color:#1a1409;font-size:12px;font-weight:900;
  background:linear-gradient(145deg,#f8e4a8,#c49535);
}
.username{font-size:15px;font-weight:700;letter-spacing:.25px;color:#f7f2e7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.first .number{background:linear-gradient(145deg,#fff2bd,#e5b94f);box-shadow:0 0 12px rgba(233,195,106,.2)}
.first .username{color:#ffe5a0}
.empty{
  text-align:center;padding:23px 10px 25px;color:#b8b1a2;
  font-size:13px;letter-spacing:.3px;
}
.footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 17px 10px;border-top:1px solid rgba(233,195,106,.18);
  color:#918875;font-size:9px;letter-spacing:1.1px;position:relative;z-index:1;
}
.status{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#c84b43;box-shadow:0 0 7px currentColor}
.dot.online{background:#70c98b}
@media(max-width:380px){
 .heading{font-size:16px}.username{font-size:13px}.header{padding:12px 13px 10px}
}
</style>
</head>
<body>
  <main class="frame">
    <div class="glint"></div>
    <header class="header">
      <div class="brand">
        <div class="emblem">M</div>
        <div>
          <div class="heading">UP NEXT MABAR</div>
          <div class="subheading">DAFTAR PESERTA</div>
        </div>
      </div>
      <div class="count" id="count">0</div>
    </header>
    <section class="list" id="list">
      <div class="empty">Menunggu peserta bergabung...</div>
    </section>
    <footer class="footer">
      <span>IKUT BANG · IKUTAN · IKUT</span>
      <span class="status"><i class="dot" id="dot"></i><span id="status">MENGHUBUNGKAN</span></span>
    </footer>
  </main>
<script>
(() => {
  "use strict";
  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const dotEl = document.getElementById("dot");
  const statusEl = document.getElementById("status");
  let socket = null;
  let retryTimer = null;
  let lastQueue = [];

  function setStatus(online) {
    dotEl.classList.toggle("online", online);
    statusEl.textContent = online ? "TERHUBUNG" : "MENCOBA KONEKSI";
  }

  function render(queue) {
    if (!Array.isArray(queue)) return;
    lastQueue = queue;
    countEl.textContent = String(queue.length);
    listEl.replaceChildren();

    if (!queue.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Belum ada peserta. Tulis “ikut” di kolom komentar!";
      listEl.appendChild(empty);
      return;
    }

    queue.forEach((item, index) => {
      const username = String(item.displayName || item.username || "Unknown");
      const row = document.createElement("div");
      row.className = "row" + (index === 0 ? " first" : "");

      const number = document.createElement("span");
      number.className = "number";
      number.textContent = String(index + 1);

      const name = document.createElement("span");
      name.className = "username";
      name.textContent = "@" + username.replace(/^@+/, "");

      row.append(number, name);
      listEl.appendChild(row);
    });
  }

  function connect() {
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

    try {
      // Bridge utama menjalankan WebSocket lokal pada port 8766.
      socket = new WebSocket("ws://127.0.0.1:8766");
    } catch (error) {
      setStatus(false);
      scheduleReconnect();
      return;
    }

    socket.onopen = () => setStatus(true);
    socket.onmessage = (event) => {
      try {
        const message = JSON.parse(event.data);
        if (message.event === "mabar_update" && message.data) {
          render(message.data.queue);
        }
      } catch (error) {
        console.warn("[MABAR] Data overlay tidak valid:", error);
      }
    };
    socket.onerror = () => setStatus(false);
    socket.onclose = () => {
      setStatus(false);
      scheduleReconnect();
    };
  }

  function scheduleReconnect() {
    if (retryTimer) return;
    retryTimer = setTimeout(() => {
      retryTimer = null;
      connect();
    }, 2500);
  }

  render(lastQueue);
  connect();
})();
</script>
</body>
</html>
